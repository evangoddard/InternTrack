name: Scan internships

on:
  workflow_dispatch:
  schedule:
    # Every 15 minutes, offset from :00/:15/:30/:45 -- scheduled GitHub Actions
    # runs are disproportionately delayed right at the top of each quarter
    # hour under load, so this dodges the worst of that queueing.
    - cron: "7,22,37,52 * * * *"

# A run that takes longer than 15 minutes shouldn't overlap with the next
# one -- two concurrent runs both writing to and pushing interntrack.db is
# a straightforward way to corrupt or race-condition the history file.
concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Run scanner
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py --limit 5

      - name: Persist history db
        run: |
          if ! git diff --quiet -- interntrack.db; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add interntrack.db
            git commit -m "chore: update posting history [skip ci]"
            git push
          else
            echo "no change to interntrack.db"
          fi
