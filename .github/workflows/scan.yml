name: Scan internships

on:
  workflow_dispatch:
  schedule:
    # Hourly, at 13 past -- exact top-of-hour schedules queue up under load
    # on GitHub's shared runners, so a small offset avoids the worst of it.
    # GitHub does not guarantee punctuality on scheduled runs; an hourly
    # cron in practice lands every 60-90 minutes.
    - cron: "13 * * * *"

# A run that overruns shouldn't overlap the next one -- two concurrent runs
# both writing and pushing the same files is a straightforward way to hit
# push conflicts or corrupt the history db.
concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      # config.yaml is gitignored (personal search criteria, not something
      # the repo carries) -- write it from a repo secret instead. Add one
      # named CONFIG_YAML under Settings -> Secrets and variables -> Actions,
      # with your local config.yaml's contents pasted in as the value.
      - name: Write config.yaml from secret
        run: echo "${{ secrets.CONFIG_YAML }}" > config.yaml

      # Fails the job outright if the secret is missing, rather than letting
      # the scan run against an empty config and produce a garbage feed.
      - name: Check config is usable
        run: |
          if [ ! -s config.yaml ]; then
            echo "config.yaml is empty -- is the CONFIG_YAML secret set?" >&2
            exit 1
          fi

      # Updates interntrack.db (the seen-before history the CLI reads).
      - name: Run scanner
        run: python main.py --limit 5

      # Regenerates web/data.json, which is what the website actually reads.
      # Without this step the site never changes no matter how often the
      # scanner runs. export_web_data.py refuses to write if the posting
      # count collapses, so a bad fetch can't blank the feed.
      - name: Refresh website data
        run: python export_web_data.py

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- interntrack.db web/data.json; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add interntrack.db web/data.json
          git commit -m "chore: refresh postings"
          # Rebase onto anything pushed while this run was working, so an
          # overlapping human commit doesn't fail the push.
          git pull --rebase --autostash
          git push
