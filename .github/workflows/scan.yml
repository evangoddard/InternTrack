name: Scan internships

on:
  workflow_dispatch:
  schedule:
    # Every 4 hours (6 runs/day), offset 13 minutes past the hour -- exact
    # top-of-hour schedules queue up under load on GitHub's shared runners,
    # so a small offset avoids the worst of that.
    - cron: "13 */4 * * *"

# A run that takes longer than 15 minutes shouldn't overlap with the next
# one -- two concurrent runs both writing to and pushing interntrack.db is
# a straightforward way to corrupt or race-condition the history file.
concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      # config.yaml is gitignored (personal search criteria, not something
      # the repo carries) -- write it from a repo secret instead. Add one
      # named CONFIG_YAML under Settings -> Secrets and variables -> Actions,
      # with your local config.yaml's contents pasted in as the value.
      - name: Write config.yaml from secret
        run: echo "${{ secrets.CONFIG_YAML }}" > config.yaml

      - name: Run scanner
        run: python main.py --limit 5

      - name: Persist history db
        run: |
          if ! git diff --quiet -- interntrack.db; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add interntrack.db
            git commit -m "chore: update posting history [skip ci]"
            git push
          else
            echo "no change to interntrack.db"
          fi
